<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>NestCast Hub</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#EEF0F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12161B" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Centro de control local para altavoces Google Home Mini y Nest Mini." />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('nestcast_dark_mode');
          var isDark = saved === 'true' || (saved === null && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <app-root></app-root>
  </body>
</html>
